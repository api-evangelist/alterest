name: Alterest
description: Alterest is the operating platform for asset-based finance (ABF), giving
  credit funds, banks, specialty lenders, and loan originators verification-first
  workflows, a unified data model, and AI-assisted controls over capital deployment,
  SPV operations, and asset origination. The platform digitizes facility management,
  borrowing-base calculations, trigger and covenant monitoring, multi-party workflows,
  and automated investor reporting, while running daily verification, tape-to-collections
  matching, integrity checks, and double-pledge detection to prevent fraud. It replaces
  fragmented spreadsheets and email with a system of record, portfolio analytics,
  immutable audit trails, and SFTP plus API data feeds to lender systems. Founded
  in 2016 and based in London, Alterest oversees $15B+ in capital across 250+ transactions,
  9+ asset classes, and 4+ regions (US, UK, EU, APAC), and is backed by Seedcamp.
